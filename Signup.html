<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoder | Signup</title>
    <!-- Stylesheet-->
    <link rel="stylesheet" href="Style.css">
    <!-- Favicon & App Icons -->
    <link rel="shortcut icon" href="Assets/favicon_io (1)/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <header>
        <h1><i class="fa fa-book-open"></i>Decoder</h1>
    </header>

    <!-- Signup Form -->
    <div class="login-container">
        <div class="login-box">
            <h2>SIGNUP</h2>
            <p>Create a Decoder your account</p>
            <form action="#" method="post" class="login-form">
                <div class="input-group">
                    <label for="Username"><i class="fa fa-user"></i>Username</label>
                    <input type="text" id="Username" placeholder="Enter your Username" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your Email" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fa fa-lock"></i>Password</label>
                    <input type="password" id="password" placeholder="Create your password" required>
                </div>

                <button type="submit" class="btn">Sign up</button>

                <div class="links">
                    <p>Already have an account? <a href="Login.html">Sign in</a></p>
                </div>
                <a href="Login.html" class="btn" style="text-decoration: none;">Back</a>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Decoder Academy | All Rights Reserved <br></p>
        <div class="link">
            <ul style="list-style: none;">
                <li><a href="#">Help</a></li>
                <li><a href="#">Setting</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="Service.html">Service</a></li>
            </ul>

        </div>

    </footer>
</body>

</html>
